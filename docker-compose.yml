services:
  postgres:
    image: postgres:16-alpine
    container_name: ajikoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ajikoi_local
    ports:
      - "5432:5432"
    volumes:
      - ajikoi_postgres_data:/var/lib/postgresql

volumes:
  ajikoi_postgres_data:
